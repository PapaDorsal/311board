# Monthly data refresh.
#
# The board covers a rolling 12 months ending at the most recent complete month,
# so with nobody running the build it silently ages: in August 2026 the site was
# serving calendar-2025 figures. This runs on the 2nd of each month, by which
# point the previous month is complete and the city has had a day to settle its
# records.
#
# It commits straight to main rather than opening a pull request. A pull request
# nobody merges leaves the data exactly as stale as no workflow at all, which is
# the problem being solved. The safety comes from tools/check-snapshot.mjs
# instead: every rebuilt file is validated before anything is committed, and a
# failure leaves the previous, known-good data in place.
name: Refresh data

on:
  schedule:
    - cron: '17 8 2 * *'      # 08:17 UTC on the 2nd, off the hour to dodge the rush
  workflow_dispatch:           # and runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The calendar years are rebuilt first and the rolling window last, because
      # build-data.mjs always writes data/leaderboard.json: finishing with the
      # rolling build leaves every file where it belongs with no shuffling.
      - name: Rebuild 2024
        run: |
          WINDOW_FROM=2024-01-01 WINDOW_TO=2025-01-01 node tools/build-data.mjs
          node tools/check-snapshot.mjs data/leaderboard.json data/leaderboard-2024.json
          mv data/leaderboard.json data/leaderboard-2024.json

      - name: Rebuild 2025
        run: |
          WINDOW_FROM=2025-01-01 WINDOW_TO=2026-01-01 node tools/build-data.mjs
          node tools/check-snapshot.mjs data/leaderboard.json data/leaderboard-2025.json
          mv data/leaderboard.json data/leaderboard-2025.json

      # The rolling window is computed from today inside build-data.mjs; the
      # check pins it to the first of this month so a build that stopped rolling
      # fails here instead of being committed as a refresh.
      - name: Rebuild the rolling window
        run: |
          git show HEAD:data/leaderboard.json > /tmp/prev-rolling.json
          node tools/build-data.mjs
          EXPECT_WINDOW_TO="$(date -u +%Y-%m-01)" node tools/check-snapshot.mjs data/leaderboard.json /tmp/prev-rolling.json

      # The stuck list, and the archive behind it. This one is NOT allowed to
      # fail quietly: data/stuck-history.json is the only record of how long the
      # site has been watching each request, and it can only be rebuilt by
      # waiting. A run that half-writes it would reset every observation count
      # to one, so the build validates the file before it can be committed.
      - name: Refresh the stuck list
        run: |
          node tools/build-stuck.mjs
          node -e 'const s=require("./data/stuck.json"), h=require("./data/stuck-history.json");
            if(!(s.citywide.total>100)) throw new Error("implausibly few stuck requests: "+s.citywide.total);
            if(Object.keys(s.wards).length!==50) throw new Error("expected 50 wards");
            const n=Object.keys(h.tickets).length;
            if(!(n>=s.citywide.total)) throw new Error("archive smaller than the current list: "+n);
            const forbidden=["Sanitation Code Violation","Building Violation"];
            for(const t of s.citywide.oldest) if(forbidden.some(f=>String(t.type).includes(f)))
              throw new Error("private-property type leaked into the public list: "+t.type);
            console.log("stuck ok:",s.citywide.total,"open,",n,"tracked, watching since",s.watchingSince);'

      # Cycling context for the ward pages. Separate datasets on their own
      # cadence, and a failure here must not cost us the 311 refresh: the ward
      # pages already treat the file as optional, so a stale one is survivable
      # where a half-written one is not.
      - name: Refresh the cycling context
        continue-on-error: true
        run: |
          node tools/build-bike-context.mjs
          node -e 'const d=require("./data/bike-context.json");
            const w=Object.keys(d.wards).length;
            if(w!==50) throw new Error("expected 50 wards, got "+w);
            if(!(d.citywide.crashes>500)) throw new Error("implausible crash count: "+d.citywide.crashes);
            if(!(d.citywide.laneMiles>100)) throw new Error("implausible lane mileage: "+d.citywide.laneMiles);
            console.log("bike context ok:",d.citywide.crashes,"crashes,",d.citywide.laneMiles,"mi");'

      # Ward page titles carry neighbourhood and alderperson names from the
      # snapshot, so they are regenerated whenever the data is.
      - name: Regenerate the per-ward pages
        run: |
          node tools/build-ward-pages.mjs
          test "$(ls ward-*.html | wc -l)" -eq 50

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ ward-*.html; then
            echo "No change in the data, nothing to commit."
            exit 0
          fi
          git add data/leaderboard.json data/leaderboard-2024.json data/leaderboard-2025.json \
                  data/bike-context.json data/stuck.json data/stuck-history.json ward-*.html
          git commit -m "Monthly data refresh

          Rebuilt from the City of Chicago 311 dataset by .github/workflows/refresh-data.yml.
          Every file passed tools/check-snapshot.mjs before this commit."
          git push
